name: Linux amd64 build

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: linux-amd64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ai-usage-gauge on Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-gnu

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build Frontend Assets
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
          bun run build

      - name: Build And Verify Linux amd64 CLI
        run: |
          set -euo pipefail
          cargo test --locked -p ai-usage-core -p ai-usage-cli
          cargo build --locked --release -p ai-usage-cli --target x86_64-unknown-linux-gnu

          stage="dist/linux-amd64"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/share/ai-usage-gauge/web"
          install -m 0755 "target/x86_64-unknown-linux-gnu/release/ai-usage-gauge" "$stage/bin/ai-usage-gauge"
          cp -R frontend/dist/. "$stage/share/ai-usage-gauge/web/"
          cp LICENSE README.md "$stage/"

          scripts/smoke-dashboard.sh \
            --port 18083 \
            --binary "$stage/bin/ai-usage-gauge" \
            --installed-assets
          tar -C "$stage" -czf "dist/ai-usage-gauge-linux-amd64.tar.gz" .

      - name: Upload Linux amd64 Archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-usage-gauge-linux-amd64
          path: dist/ai-usage-gauge-linux-amd64.tar.gz
          if-no-files-found: error
